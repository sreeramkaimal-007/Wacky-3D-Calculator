name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web app & Android APK
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          rm -f capacitor.config.ts
          node -e 'require("fs").writeFileSync("capacitor.config.json", JSON.stringify({appId:"com.wacky3d.calculator",appName:"Wacky 3D Calculator",webDir:"dist",android:{allowMixedContent:false,backgroundColor:"#FFEAF3"}}, null, 2))'
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: wacky-3d-calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
