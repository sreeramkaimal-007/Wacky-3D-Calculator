name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web app & Android APK
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob
          rm -f capacitor.config.ts
          node -e 'require("fs").writeFileSync("capacitor.config.json", JSON.stringify({appId:"com.wacky3d.calculator",appName:"Wacky 3D Calculator",webDir:"dist",android:{allowMixedContent:false,backgroundColor:"#FFEAF3"}}, null, 2))'
          npx cap add android
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            if (!xml.includes("android.permission.VIBRATE")) {
              xml = xml.replace("<application", "<uses-permission android:name=\"android.permission.VIBRATE\" />\n    <application");
            }
            if (!xml.includes("com.google.android.gms.permission.AD_ID")) {
              xml = xml.replace("<application", "<uses-permission android:name=\"com.google.android.gms.permission.AD_ID\" />\n    <application");
            }
            if (!xml.includes("com.google.android.gms.ads.APPLICATION_ID")) {
              xml = xml.replace("</application>", "    <meta-data\n            android:name=\"com.google.android.gms.ads.APPLICATION_ID\"\n            android:value=\"ca-app-pub-4582959030219358~8991228181\" />\n    </application>");
            }
            fs.writeFileSync(manifestPath, xml);
          '
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: wacky-3d-calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
